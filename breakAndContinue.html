<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Break And Continue:</title>
</head>
<body>
    

    <script>

        for(let i =1; i<=50; i++){
           
            if(i==25){
                break;
            }
              console.log(i);
        }
        
    </script>

</body>
</html>
