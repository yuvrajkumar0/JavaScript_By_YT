<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>functions </title>
</head>
<body>
    
    <script>
        function sum(a,b){
            let sum = a+b;
            return sum;
        }
        console.log(sum(4,5));
        console.log(sum(14,5));
        console.log(sum(44,5));
        console.log(sum(54,5));
        console.log(sum(64,5));
        console.log(sum(47,5));

        function greating(name){
            console.log(`namaste ${name} uncle`);
        }
        greating('satish');

    </script>

</body>
</html>
