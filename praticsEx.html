<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pratics Exercise</title>
</head>
<style>
    #my-button{
        background-color: rgb(234, 151, 151);
        height: 45px;
        width: 45px;
        font-size: 25px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
</style>
<body>
     <h3 id="greating"></h3>
     <button id="my-button" onclick="clickButton();">0</button>
    <script>
         let noOfClick = 0;
        function clickButton(){
            
            let button = document.querySelector('#my-button');
            noOfClick++;
            button.innerText=noOfClick;
        }  











        function greating(personName){
        let date = new Date();
        let hours= date.getHours();
        hours = 13;
        let heading = document.querySelector('#greating');
        if(hours>5 && hours<12){
          heading.innerText = `Good Morning ${personName}`;
        }else if(hours>12 && hours<18){
             heading.innerText = `Good Afternoon  ${personName}`;
        }else{
             heading.innerText = `Good Night  ${personName}`;
        }
    }
    greating('yuraj')

    </script>
</body>
</html>
