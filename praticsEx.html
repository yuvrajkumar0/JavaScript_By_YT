<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pratics Exercise</title>
</head>
<body>
     <h3 id="greating"></h3>
    <script>
        function greating(personName){
        let date = new Date();
        let hours= date.getHours();
        hours = 13;
        let heading = document.querySelector('#greating');
        if(hours>5 && hours<12){
          heading.innerText = `Good Morning ${personName}`;
        }else if(hours>12 && hours<18){
             heading.innerText = `Good Afternoon  ${personName}`;
        }else{
             heading.innerText = `Good Night  ${personName}`;
        }
    }
    greating('yuraj')

    </script>
</body>
</html>
